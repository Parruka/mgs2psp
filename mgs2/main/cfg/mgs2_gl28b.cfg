# gl28 (2026-11-19): gl27 for the battery switch-off study (gl27 run 1 switched off on the battery inside codec call 1; 3 of 10
# battery runs stopped, 0 of 11 on USB charging; cause unknown). Three changes, each its own setting; everything else is gl27's
# (cfg/mgs2_gl27.cfg a97f7cd5), so hashref.txt stays 72e0ca4c and the game equals gl27's:
#  1. MGS2_ME_REST=1 (end of the file): the Media Engine rests in HALT whenever its queue stays empty in the main CPU's turns, and the
#     main CPU wakes it with its interrupt when the ME's turn begins (v30me5's resting ME, which ran 76,548 rests with no lost wake).
#  2. MGS2_BAT_REC=1 (end of the file): every battery.txt line adds the battery thread's own lateness and the picture loop's and the
#     ME's state (reads only; no new file).
#  3. The dense hash window is gone (it was MGS2_HASH_DENSE=15700:16010: a full-RAM state hash every vblank right before codec call 1,
#     the heaviest sustained load of the run, not something the game itself does). The PC twin and the emulator keep their own dense
#     checks where needed; the PSP keeps the hash every 500 vblanks.
# gl26: gl25 made the deck's standard: two copy areas in every ME turn (MGS2_ME_PIC_TWO=1; gl25's PSP run: the deck's two-area turns
# -15.6%, the rain's -22.8% against the same turns of gl24) and the cosmetic actors at half rate in every 100-vblank block from vb 24,000
# (MGS2_HALF_CYCLE b x 8: ropes and lamps every other step, the trail off, the sea as before; DEVIATIONS.md G1). New: the ME times its
# walk by kind (the calls by lane, the held calls' flushes, passes 2-3, GS primitives): a 'gl26 walk split' line after each ME turn's line
# and a total at the end, for the native renderer's design. Nothing drawn changes. hashref.txt = cfg/hashref_g22b.txt (72e0ca4c: the x86
# twin with cut b in every block from 24,000); the game state from vb 24,100 on differs from gl25's (the guards' random choices).
# (gl25's header below says DEVIATIONS.md P1: it is C7.)
# gl25: gl24 with the walk allowed to run through the next step too, in the two-area turns (MGS2_ME_PIC_TWO=2: off, on, ...). The game
# makes a picture in two steps: a drawing step that ends with the walk posted, then a logic-only step. gl24's PSP run showed the main
# CPU waited for the walk at the end of the logic-only step (about 23 ms a deck step). Now it waits at the next drawing step's end, or
# at the second hook after the walk at the latest. The emulator check lchk4 found that what a walk reads from game memory outside its
# copies stays unchanged for two hooks on the route except at vb 20692 (the talks) and vb 26008 (the deck's start): in those two frames
# the PSP's picture may draw a texture with bytes the game wrote one step later (DEVIATIONS.md P1). Counters from the review fixed.
# Hashes stay af1c02eb (the game is the same).
# gl24: gl23 with two copy areas in every other ME turn (MGS2_ME_PIC_TWO=2: off, on, ...): the copy arena and its extents in two
# halves, so a step's copies go to one half while the ME walks the step before from the other, and the step's first copy plan no longer
# waits for that walk (gl23's PSP run: the main CPU waited about 23 ms a deck step there). The main CPU waits for the walk at the next
# hook instead. The emulator check gl24d found that what the walks read from RAM outside their copies does not change by the next hook
# (the boot's refill and one opening step apart). Two frames on the GE side now in every ME turn (MGS2_ME_PIC_GE2=1), the GE's finish told
# at once (MGS2_ME_PIC_GEFAST=1). The ME's turn lines should count right on the PSP (gl24b: its hand-over write-back after its own counts, its idle time
# in the shared words; review fixes: a lone big transfer gets the whole arena, the stand-in thread's idle read cannot hang). hashref.txt stays af1c02eb.
# gl23: gl22 with two frames on the GE side in every other ME turn (MGS2_ME_PIC_GE2=2: off, on, ...): the ME may begin frame N+1
# while the GE still draws frame N (a second frame memory of 2 MB from the heap, the lists alternating; the texture cache keeps the
# textures of the frame in flight: ge/texcache.c tk_guard). gl22's PSP run: the GE draws a deck frame in 22-27 ms, but the ME could
# not begin the next frame before it was drawn, and the main CPU waited about 20 ms a step for the ME. The GE's finish now tells the
# ME at once in every ME turn (MGS2_ME_PIC_GEFAST=1; gl22 timed it in turns). The game is gl22's, so hashref.txt stays af1c02eb.
# gl22: gl21 (the same game, profiles and code order; a short run to vblank 31,400) + the GE's finish timed by sceGu's finish callback,
# and in every other ME turn the callback tells the ME at once that the GE is done (MGS2_ME_PIC_GEFAST=2: off, on, ...), instead of
# waiting for the main CPU to notice (gl21's ME waited 16 ms a deck step, 41 in the rain, for the GE at a frame's start). Every other
# setting is gl21's (cfg/mgs2_gl21.cfg bae3ade0), so hashref.txt stays af1c02eb and the game equals gl21's.
# gl21: gl20's game code, profiles and code order with the ME's clock fixed (gl20's ME took a system-call exception at its start
# and never ran: ge/xme.c XME_CLK, tools/me_call_chk.py). A SHORT RUN (plan of 2026-11-19 11:28): it stops after the deck at vblank
# 31,400 (gl20 ran to 37,800), and its per-step file and deck summary start at vblank 24,000 (gl20: 31,800). Every other setting is
# gl20's (cfg/mgs2_gl20.cfg b39e19d2), so hashref.txt stays gl19's (af1c02eb) and each window compares with gl19's and gl20's runs.
# gl20: gl19's game code and settings with fresh PGO profiles and a new code order (main/README.md "gl20 PGO"), plus the ME-side
# timers (one "me turn vb ..." log line per ME turn, a "me turns (gl20)" line in the report). Every setting below is gl19fb's,
# unchanged (cfg/mgs2_gl19fb.cfg d3e4745b), so hashref.txt is gl19's (cfg/hashref_gl19fb.txt af1c02eb) and every window compares
# one to one with gl19's PSP run. The lines that follow are gl19fb's file as it is.
# gl19 (variant fb): gl18me with the deck's cosmetic actors at half rate in turns (MGS2_HALF, plan_deck_25fps.md Phase 1). From
# vblank 24,000 the run takes turns of 100 vblanks: two turns with every actor as before, two turns with the ropes, the lamps and the
# sea moved every other game step and the trail effect (afterimage) not moved at all, two turns as before, two turns with the same
# cut without the sea, and so on to the end (the model found the sea's cut dear on the aft deck in the rain). The cut changes the game's
# own state, so from the first cut turn the hashes are no longer gl18me's: hashref.txt is the PC twin's run with these same
# settings, and every hash, frame digest and picture must equal the PC's and the emulator's. Two turns each (not one) so that each
# setting meets both of the picture's makers (MGS2_ME_PIC_TURN below: the ME and the main CPU alternate every 100 vblanks).
# gl18me: the first build that makes the game's picture on the PSP's Media Engine (ME), the second processor that sits idle in a
# game. It is gl18 with the rain's seven skips always on (gl18's faster turns) and the picture made by the ME and by the main CPU
# in turns of 100 vblanks, so one run times both on the same scenes. The game's code and choices are gl18's, and every picture
# must equal gl18's. README.txt has the details.
# Below: the indoor route's settings (v30's, as in gl4), then gl18me's own at the end.
# v30: a new timing route, indoors. The game's code is v29's (the same code generator); the build adds the code this route needs and
# its profile and code order take the route into account (README.txt).
# pad.txt plays the opening as before, skips Otacon's deck tutorial and the boarding cutscene (START at vblank 23410 and every 1000
# vblanks from 24000 to 29000), then from vblank 30501 walks Snake unseen across the aft deck to the hatch of Deck-A, crew's quarters
# and inside. From vblank 31800 to the end (37800) it plays 2 minutes inside: stand 10 s, walk the port hallway and the aft corridor
# 36 s, crawl 8 s, punch and shoot 8 s, look around in first person 12 s, sneak to the corner of the guard's hallway 19 s, then step
# into his view: he calls it in, an alert with backup units, evasion, and a second alert while Snake runs (27 s).
# Those 2 minutes are the timed steps ("deck 31800").
vblanks 31400
deck 24000
# v21-v30: every speedup is on from the start, the reduced renderer included (it runs on the steps whose picture is never shown).
# That is the build's own default, so there is no MGS2_OPT line. hashref.txt holds the PC reference for this route and setting.
# v12: the hash lines also print how many vector-op runs fell back to the exact slow path so far (diagnostic only).
MGS2_VFPU_STAT=1
# Split finder (v15): every state hash is compared on the PSP with the PC's value in hashref.txt, and from vblank 15700 to 16010
# there is a hash at every vblank. At the first difference it prints "split:" lines and writes the game RAM to split.<vblank>
# (32 MB) in this folder. Measurement only.
# gl28: MGS2_HASH_DENSE=15700:16010 removed (see the top: the dense window is off on the PSP for the switch-off study)
MGS2_HASH_REF=hashref.txt
# v30: a state hash every 500 vblanks, and every 100 in the timed steps from vblank 31800 to the end (37800): 61 checks.
MGS2_HASH_EVERY=500,31800:100
# gl18me: the rain's seven exact skips (DEVIATIONS.md E5) always on: gl18 times them against the hiding alone; here they stay on so
# that the turns below time only the picture. C1 (the faces on the GE) and step 3's trims on; C2 (the people on the GE) and gl17's
# effects off, as in gl18.
MGS2_OPT2=fffff9df
# gl19: the turns. From vblank 24,000, 100 vblanks each, in the order of the lists: the speedups all on in every turn (ffffffff, as
# the build's default), the rain's skips as above in every turn (fffff9df), and the cut (MGS2_HALF_CYCLE) off, off, f, f, off, off,
# b, b: f = 1 the ropes + 2 the lamps + 4 the sea + 8 the trail, b = the same without the sea; 1 the
# ropes (ropemain, ropemain2) and 4 the sea (wave2, wave) act on even game steps only, 2 the lamps (fade_lgt, c_light, bonbori) on odd
# steps only, 8 the trail effect (afterimage) never. The steps are counted by the game's own actor loop, the same on the PC and
# the PSP. steps.csv's cfg column: 35 in the turns without the cut, 51 ("cut all four") and 47 ("cut rope+lamp+trail") in the others.
MGS2_OPT_CYCLE=24000:100:ffffffff,ffffffff,ffffffff,ffffffff,ffffffff,ffffffff,ffffffff,ffffffff
MGS2_OPT2_CYCLE=fffff9df,fffff9df,fffff9df,fffff9df,fffff9df,fffff9df,fffff9df,fffff9df
MGS2_HALF_CYCLE=b,b,b,b,b,b,b,b
# The rain: the big sheets of speckled drops close to the camera drawn whole (1 = every strip, as the PS2), the splash at Snake's
# feet 1 strip in 2 (as gl10), no rain streaks (0), the rain's own sprites left out (0). The skips above are exact only with these
# last two at 0.
MGS2_GL_RAIN=1
MGS2_GL_SPLASH=2
MGS2_GL_STREAKS=0
MGS2_GL_RAIN_SPRITES=0
# Frame checks: the frames whose last vblank lies in 31561-31959 (indoors, Snake and the guards) get their list and frame digests in
# log.txt, to compare with the PC's, which builds the same frames word for word (measurement only, outside the step's time).
MGS2_GL_DIG=31561:31959
# Pictures: at these vblanks the frame on the screen is saved as shot_<vblank>.bmp next to the EBOOT (outside the step's time), to
# compare with the emulator's and with gl18's: the same sixteen moments as gl15 to gl18. Each is taken in a known turn (the ME's or
# the main CPU's). gl19: the first four must equal gl18's; from 24,246 on the game differs from gl18's, so each must equal the
# emulator's.
MGS2_GL_SHOT=8762,10518,15763,23265,24246,24786,29502,30502,31114,31665,32503,33615,34913,35029,35591,36943
# The crash catcher: 3 = catcher 3b, as in gl6. At a crash the record goes on the screen (red text); then, when the crash came from
# the game or the harness (not from the system), the stopped thread is handed back to the system asleep, the way the PSPLink debugger
# does it, and the PSP's other threads run again: the record also goes to crash.txt and log.txt (green lines under the record say
# so), and battery.txt goes on. HOME should then quit. At the start the screen offers the self-test: X makes a deliberate error that
# must end with the SELF-TEST record and three green lines; O, or 15 s without an answer, starts the run.
MGS2_EXC=3
# The texture pool: 2688 KB, as gl6.
MGS2_GL_TEXKB=2688
# The deepest use of the main thread's stack, in the log's last lines: 1 = measured (outside the steps' time). gl18me's main thread
# keeps 256 KB for itself instead of 1 MB (it has used about 3 KB in every run on your PSP); the 768 KB go to the game's heap.
MGS2_STACK_MARK=1
# The picture on the ME (task #180, step 4e): 4 = the ME makes the picture from copies of what the game sent, kept in its own memory
# (its eDRAM). The main CPU takes turns with it (MGS2_ME_PIC_TURN): vblanks 0-99, 200-299, ... are the ME's, 100-199, 300-399, ...
# the main CPU's, which then makes the picture itself. If the ME does not start, the main CPU makes every picture and the log says
# so. If the ME stops answering for 1 s while the main CPU waits for it, or faults, it is held in reset and the picture stops for
# the rest of the run (the screen keeps its last frame), while the game goes on to the end: the log, the hashes and steps.csv stay
# complete.
MGS2_ME_PIC=4
MGS2_ME_PIC_TURN=100
MGS2_ME_PIC_GEFAST=1
MGS2_ME_PIC_GE2=1
MGS2_ME_PIC_TWO=1
# gl27 (2026-11-19): gl26's walk split timers off (MGS2_ME_SPLIT unset: they cost the ME ~6 us a timed callback on the PSP);
# the next list waits for the screen to show the frame before (the black marks on the deck in gl26): on in every other ME turn
# and the main CPU turn after it (the cost and the counted cases off), always from vb 30,500 (Snake's walk on the aft deck)
MGS2_GL_FLIPWAIT=2
MGS2_GL_FLIPWAIT_FROM=30500
# gl28: the Media Engine rests in HALT through the main CPU's turns (0 = it spins when idle, as gl27). A 'main turn vb A-B gl28 me
# rest' line per main CPU turn and 'gl28 me rest totals' at the end of log.txt.
MGS2_ME_REST=1
# gl28: battery.txt's lines add the battery thread's lateness and the picture loop's and the ME's state (0 = gl27's lines).
MGS2_BAT_REC=1
