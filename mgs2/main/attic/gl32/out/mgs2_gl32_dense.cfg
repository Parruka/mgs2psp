# MGS2_NAT_T=0 would switch off the ME's timing of the native runs.
# gl32: native in every turn (was 0,0,3,3).
MGS2_NAT_CYCLE=3,3,3,3
# gl32: the vertex cache by turn (see the top): 0 = off, 1 = the cache, 3 = the cache and static streams read in place by the ME.
MGS2_NAT_VC_CYCLE=0,0,1,1,3,3
MGS2_NAT_VC_KB=256
# emulator test variant (not delivered): the digests of every frame from boot (MGS2_GL_DIG=0:31400 above) and a picture of every
# frame of the walk for the reader's references, as gl31's emu_e3
MGS2_GL_SHOT_RANGE=30500:31400:2
