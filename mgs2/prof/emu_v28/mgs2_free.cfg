# v26: stage calls by table, free play's functions compiled in, profile and code order from three routes; v25f's route.
# pad.txt plays the opening as before, then START at vblank 23410
# and every 1000 vblanks from 24000 to 29000 skips Otacon's deck tutorial and the boarding cutscene; Snake is free on the aft deck
# from about vblank 30000. From vblank 30500 to the end (36500) it plays 2 minutes on the deck: stand 10 s, walk the deck 36 s,
# crawl 8 s, punch and shoot 8 s, look around in first person 12 s, then walk into the guards' view (an alert) 46 s.
# Those 2 minutes are the timed steps ("deck 30500"); v24 timed the tutorial.
vblanks 36500
deck 30500
# v21-v26: every speedup is on from the start, the reduced renderer included (it runs on the steps whose picture is never shown).
# That is the build's own default, so there is no MGS2_OPT line. hashref.txt holds the PC reference for this route and setting.
# v12: the hash lines also print how many vector-op runs fell back to the exact slow path so far (diagnostic only).
MGS2_VFPU_STAT=1
# Split finder (v15): every state hash is compared on the PSP with the PC's value in hashref.txt, and from vblank 15700 to 16010
# there is a hash at every vblank. At the first difference it prints "split:" lines and writes the game RAM to split.<vblank>
# (32 MB) in this folder. Measurement only.
MGS2_HASH_DENSE=15700:16010
MGS2_HASH_REF=hashref.txt
# v25f, v26: a state hash every 500 vblanks, and every 100 in the timed free play from vblank 30500 to the end (36500): 61 checks.
MGS2_HASH_EVERY=500,30500:100
prof 36495 36496
