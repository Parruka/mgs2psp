# v30me5: v30 with one change, the resting Media Engine (README.txt). When it has no sound commands to mix, the Media Engine now
# waits in its halt instruction instead of polling at full speed, and the main CPU wakes it with one interrupt after it queues
# commands. The game's code, the route, the sound mix, the crash catcher and battery.txt are v30's.
# v30 (the route, unchanged): a new timing route, indoors. The game's code is v29's (the same code generator); the build adds the
# code this route needs and its profile and code order take the route into account.
# pad.txt plays the opening as before, skips Otacon's deck tutorial and the boarding cutscene (START at vblank 23410 and every 1000
# vblanks from 24000 to 29000), then from vblank 30501 walks Snake unseen across the aft deck to the hatch of Deck-A, crew's quarters
# and inside. From vblank 31800 to the end (37800) it plays 2 minutes inside: stand 10 s, walk the port hallway and the aft corridor
# 36 s, crawl 8 s, punch and shoot 8 s, look around in first person 12 s, sneak to the corner of the guard's hallway 19 s, then step
# into his view: he calls it in, an alert with backup units, evasion, and a second alert while Snake runs (27 s).
# Those 2 minutes are the timed steps ("deck 31800").
vblanks 37800
deck 31800
# v21-v30: every speedup is on from the start, the reduced renderer included (it runs on the steps whose picture is never shown).
# That is the build's own default, so there is no MGS2_OPT line. hashref.txt holds the PC reference for this route and setting.
# v12: the hash lines also print how many vector-op runs fell back to the exact slow path so far (diagnostic only).
MGS2_VFPU_STAT=1
# Split finder (v15): every state hash is compared on the PSP with the PC's value in hashref.txt, and from vblank 15700 to 16010
# there is a hash at every vblank. At the first difference it prints "split:" lines and writes the game RAM to split.<vblank>
# (32 MB) in this folder. Measurement only.
MGS2_HASH_DENSE=15700:16010
MGS2_HASH_REF=hashref.txt
# v30: a state hash every 500 vblanks, and every 100 in the timed steps from vblank 31800 to the end (37800): 61 checks.
MGS2_HASH_EVERY=500,31800:100
# v26me: the voice mix split. The game's sound model stays on the main CPU; every sound command also goes to the Media Engine,
# which runs the full voice mix (decode, interpolation, envelopes, volumes; no reverb yet) into a checksum: nothing is played.
# "mix: ck" lines compare it with the PC every 10 s of sound; "mix vb" lines every 100 vblanks give the Media Engine's time and
# the main CPU's waits. Without this line the Media Engine stays off.
MGS2_SPU_ME=1
# me_steps.csv: the Media Engine's time, commands and renders per step, from the first timed step (vblank 31800).
MGS2_ME_STEPS_FROM=31800
# v30me5: 1 = the Media Engine rests when it has nothing to do (its halt instruction) and the main CPU wakes it with an interrupt
# after it queues sound commands; "mix vb" lines every 100 vblanks and every battery.txt line count its rests, its wake-ups and the
# main CPU's wake calls. If it ever fails to wake, the main CPU stops the mix after 2 s and puts the Media Engine back in reset; the
# game goes on, exact. 0 = no rest: it polls at full speed as in v30.
MGS2_ME_REST=1
# v26me4: the crash catcher, rebuilt. 1 = on: at a crash the record stays on the screen (red text) and the PSP stays on until the
# power switch; nothing is written then. At the start the screen offers the self-test: X makes a deliberate error that must end on
# that screen titled SELF-TEST; O, or 15 s without an answer, starts the run. 0 = off.
MGS2_EXC=1
