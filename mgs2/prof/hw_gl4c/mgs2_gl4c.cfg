# gl4c: gl4b (crash catcher 3b) on a new route made to test the codec. The opening is the same as before up to the aft deck; then at
# vblank 30510 SELECT opens the codec and O calls Otacon 15 times (vblanks 30620 to 56866): about 25 minutes of codec screens, about
# four times as long as the two story calls together, up to the end at vblank 60000. Every switch-off so far came in a codec call.
# The game's code is gl4b's plus the 279 deck functions those calls run; nothing else changed. README.txt has the details.
# pad.txt plays the opening as before and skips Otacon's deck tutorial and the boarding cutscene (START at vblank 23410 and every 1000
# vblanks from 24000 to 29000), then leaves Snake standing on the aft deck until the codec opens.
vblanks 60000
# The timed steps (steps.csv and the log's step lines): the last 6000 vblanks (calls 13 to 15 and the end), the same size as gl4b's.
deck 54000
# v12: the hash lines also print how many vector-op runs fell back to the exact slow path so far (diagnostic only).
MGS2_VFPU_STAT=1
# Split finder (v15): every state hash is compared on the PSP with the PC's value in hashref.txt, and from vblank 15700 to 16010
# there is a hash at every vblank. At the first difference it prints "split:" lines and writes the game RAM to split.<vblank>
# (32 MB) in this folder. Measurement only.
MGS2_HASH_DENSE=15700:16010
MGS2_HASH_REF=hashref.txt
# A state hash every 500 vblanks, and every 100 in the timed steps from vblank 54000 to the end.
MGS2_HASH_EVERY=500,54000:100
# Everything is on throughout (no timing settings taking turns).
# Pictures: at these vblanks the frame on the screen is saved as shot_<vblank>.bmp next to the EBOOT (outside the step's time), to
# compare with the emulator's: the codec just opened, calls 1, 3, 7 and 11, and the codec after the last call.
MGS2_GL_SHOT=30600,31000,38000,45000,52500,59900
# The crash catcher: 3 = catcher 3b, as in gl4b. At a crash the record goes on the screen (red text); then, when the crash came from
# the game or the harness (not from the system), the stopped thread is handed back to the system asleep, the way the PSPLink debugger
# does it, and the PSP's other threads run again: the record also goes to crash.txt and log.txt (green lines under the record say
# so), and battery.txt goes on. HOME should then quit. At the start the screen offers the self-test: X makes a deliberate error that
# must end with the SELF-TEST record and three green lines; O, or 15 s without an answer, starts the run.
MGS2_EXC=3
# The texture pool: 2688 KB, as gl4b.
MGS2_GL_TEXKB=2688
# The deepest use of the main thread's stack, in the log's last lines: 1 = measured (outside the steps' time).
MGS2_STACK_MARK=1
