# gl2m: gl2d with the memory fix: data the PSP's IOP side sends to the game now goes straight into the game's memory instead of
# waiting in a copy (gl2d crashed at vblank 26108 when a 1.1 MB load found no memory for its copy). README.txt has the details.
# Everything below is gl2d's, unchanged.
# gl2d: gl2 with system diagnostics added to battery.txt (power notices, how long a low-priority task of the harness waits for the
# processor, the system's own task counts, and the list of tasks every minute): read-only, for the switch-offs (README.txt).
# Everything below is gl2's, unchanged.
# gl2: the game's picture on the PSP, gl1 with the faster texture conversion (README.txt). The game's code and the indoor route are
# v30's, with the faster state hash (state hash 2: the same checks, faster; hashref.txt is its PC reference). The Media Engine is off.
# v30: a new timing route, indoors. The game's code is v29's (the same code generator); the build adds the code this route needs and
# its profile and code order take the route into account (README.txt).
# pad.txt plays the opening as before, skips Otacon's deck tutorial and the boarding cutscene (START at vblank 23410 and every 1000
# vblanks from 24000 to 29000), then from vblank 30501 walks Snake unseen across the aft deck to the hatch of Deck-A, crew's quarters
# and inside. From vblank 31800 to the end (37800) it plays 2 minutes inside: stand 10 s, walk the port hallway and the aft corridor
# 36 s, crawl 8 s, punch and shoot 8 s, look around in first person 12 s, sneak to the corner of the guard's hallway 19 s, then step
# into his view: he calls it in, an alert with backup units, evasion, and a second alert while Snake runs (27 s).
# Those 2 minutes are the timed steps ("deck 31800").
vblanks 37800
deck 31800
# v21-v30: every speedup is on from the start, the reduced renderer included (it runs on the steps whose picture is never shown).
# That is the build's own default, so there is no MGS2_OPT line. hashref.txt holds the PC reference for this route and setting.
# v12: the hash lines also print how many vector-op runs fell back to the exact slow path so far (diagnostic only).
MGS2_VFPU_STAT=1
# Split finder (v15): every state hash is compared on the PSP with the PC's value in hashref.txt, and from vblank 15700 to 16010
# there is a hash at every vblank. At the first difference it prints "split:" lines and writes the game RAM to split.<vblank>
# (32 MB) in this folder. Measurement only.
MGS2_HASH_DENSE=15700:16010
MGS2_HASH_REF=hashref.txt
# v30: a state hash every 500 vblanks, and every 100 in the timed steps from vblank 31800 to the end (37800): 61 checks.
MGS2_HASH_EVERY=500,31800:100

# gl1: the game's picture on the PSP. The game's own graphics commands are translated as the game runs and drawn by the PSP's
# graphics chip (GE): each step the PS2 would show becomes a frame, drawn into one of two frame buffers while the game goes on, and
# shown at the next screen refresh. Nothing in the game's state is touched (the state hashes stay the PC's).
# Timing windows from vblank 31800, 100 steps each, taking turns: all on / picture off / GE overlap off (the CPU waits for each frame,
# which gives the GE's own time per frame) / VU memory synced by the old scan (today's faster sync off). The log's window lines and its
# summary give each one's mean; the picture's cost is "all on" against "picture off".
MGS2_OPT_CYCLE=31800:100:ffffffff,fffff7ff,ffffefff,ffffdfff
# Frame checks: the frames whose last vblank lies in 31801-31899 (all on) get their list and frame digests in log.txt, to compare
# with the PC's, which builds the same frames word for word.
MGS2_GL_DIG=31801:31899
# Pictures: at these vblanks the frame on the screen is saved as shot_<vblank>.bmp next to the EBOOT (outside the step's time), to
# compare with the emulator's.
MGS2_GL_SHOT=31850,32650,34250,35850,36950,37450
# The crash catcher, as in the Media Engine builds: 1 = on. At a crash the record stays on the screen (red text, over the game's
# picture if one is on it) and the PSP stays on until the power switch; nothing is written then. At the start the screen offers the
# self-test: X makes a deliberate error that must end on that screen titled SELF-TEST; O, or 15 s without an answer, starts the run.
MGS2_EXC=1
# The texture pool: 2048 KB instead of the build's 2560 KB, for memory. With 2560 KB the PSP would have about 280 KB free at the
# lowest point of this route (the emulator's runs); with 2048 KB about 790 KB. Every texture still fits (the heaviest frame needs
# 1716 KB of the 1792 KB the cache may keep); some textures are converted again more often.
MGS2_GL_TEXKB=2048
