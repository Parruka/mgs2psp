# v24 crew deck: the same build as MGS2T_v24, sent to the next Tanker area (stage w01a, the crew deck) instead of staying on the
# deck. MGS2_POKE writes "w01a" into the opening's next-area string at vblank 21000 and 22950, so w01a loads at
# vblank 23337 and the timed steps from vblank 24000 are on the crew deck (as in v10-v18). Measurement only.
MGS2_POKE=21000:1190ed0:61313077,21000:1190f78:61313077,21000:1af8118:61313077,21000:1af81c0:61313077,22950:1190ed0:61313077,22950:1190f78:61313077,22950:1af8118:61313077,22950:1af81c0:61313077
# v21-v24: every speedup is on from the start, the reduced renderer included (it runs on the steps whose picture is never shown).
# That is the build's own default, so there is no MGS2_OPT line. hashref.txt holds the PC reference for this setting.
# v12: the hash lines also print how many vector-op runs fell back to the exact slow path so far (diagnostic only).
MGS2_VFPU_STAT=1
# Split finder (v15): every state hash is compared on the PSP with the PC's value in hashref.txt, and from vblank 15700 to 16010
# there is a hash at every vblank. At the first difference it prints "split:" lines and writes the game RAM to split.<vblank>
# (32 MB) in this folder. Measurement only.
MGS2_HASH_DENSE=15700:16010
MGS2_HASH_REF=hashref.txt
# v24: a state hash every 500 vblanks as before, and every 100 on the deck from vblank 24000 to the end (25200): 13 checks of the
# timed deck steps instead of 3, the last one at the stop.
MGS2_HASH_EVERY=500,24000:100
prof 25195 25196
